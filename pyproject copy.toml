[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gear-analysis"
version = "1.0.0"
description = "Crown gear geometry analysis for detecting manufacturing setup errors"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Gear Analysis Team" }
]
keywords = ["gear", "analysis", "metrology", "manufacturing", "3d", "stl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "open3d>=0.17.0",
    "trimesh>=3.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.0.260",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
]

[project.scripts]
gear-analysis = "gear_analysis.cli:main"

[project.urls]
Homepage = "https://github.com/example/gear-analysis"
Documentation = "https://gear-analysis.readthedocs.io"
Repository = "https://github.com/example/gear-analysis"
Issues = "https://github.com/example/gear-analysis/issues"

[tool.hatch.build.targets.wheel]
packages = ["gear_analysis"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=gear_analysis --cov-report=term-missing"
